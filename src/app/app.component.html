<!-- Skip link: primo elemento focalizzabile, visibile solo al focus -->
<a class="skip-link" href="#main-content" (click)="skipToMain($event)">{{ 'a11y.skipToContent' | transloco }}</a>

<!-- Main Header -->
<app-main-header />

<!-- Main Application Content -->
<main id="main-content" tabindex="-1" class="flex-1 px-sm py-xl tb:px-base sd:px-lg focus:outline-none">
  <router-outlet />
</main>

<app-panel-host />

<!-- Main Footer -->
<app-main-footer />


<!-- Fullscreen Loader -->
<app-fullscreen-loader />
