<header class="sticky top-0 z-50 w-full glass">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">

    <!-- Logo -->
    <a routerLink="/" class="text-xl font-semibold text-white hover:text-brand-200 transition-colors">
      MyApp
    </a>

    <!-- Desktop nav -->
    <nav class="hidden md:flex items-center gap-6">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-white font-medium"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="text-sm text-brand-200 hover:text-white transition-colors"
        >
          {{ link.label }}
        </a>
      }

      <a
        routerLink="/contact"
        class="rounded-md bg-brand-400 px-4 py-2 text-sm font-medium text-white hover:bg-brand-300 transition-colors"
      >
        Get started
      </a>
    </nav>

    <!-- Hamburger button (mobile only) -->
    <button
      type="button"
      class="md:hidden inline-flex items-center justify-center rounded-md p-2 text-brand-200 hover:bg-white/10 hover:text-white transition-colors"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-label="Toggle menu"
      (click)="toggleMobileMenu()"
    >
      @if (!isMobileMenuOpen()) {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      }
    </button>
  </div>
</header>

<!-- Mobile side panel overlay -->
<div
  class="fixed inset-0 z-40 md:hidden transition-all duration-300"
  [class.pointer-events-none]="!isMobileMenuOpen()"
  [class.invisible]="!isMobileMenuOpen()"
>
  <!-- Backdrop -->
  <div
    class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-300"
    [class.opacity-0]="!isMobileMenuOpen()"
    [class.opacity-100]="isMobileMenuOpen()"
    (click)="closeMobileMenu()"
  ></div>

  <!-- Drawer panel -->
  <aside
    class="absolute left-0 top-0 h-full w-72 flex flex-col transition-transform duration-300 ease-in-out glass"
    [class.-translate-x-full]="!isMobileMenuOpen()"
    [class.translate-x-0]="isMobileMenuOpen()"
  >
    <!-- Drawer header -->
    <div class="flex items-center justify-between border-b border-white/10 px-5 py-4">
      <span class="text-base font-semibold text-white">Menu</span>
      <button
        type="button"
        class="rounded-md p-1.5 text-brand-200 hover:bg-white/10 hover:text-white transition-colors"
        aria-label="Close menu"
        (click)="closeMobileMenu()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Drawer nav links -->
    <nav class="flex flex-col gap-1 px-3 py-4 flex-1">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-white/10 text-white font-medium"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="rounded-md px-3 py-2.5 text-sm text-brand-200 hover:bg-white/10 hover:text-white transition-colors"
          (click)="closeMobileMenu()"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- CTA at bottom -->
    <div class="border-t border-white/10 px-5 py-4">
      <a
        routerLink="/contact"
        class="block w-full rounded-md bg-brand-400 px-4 py-2.5 text-center text-sm font-medium text-white hover:bg-brand-300 transition-colors"
        (click)="closeMobileMenu()"
      >
        Get started
      </a>
    </div>
  </aside>
</div>
