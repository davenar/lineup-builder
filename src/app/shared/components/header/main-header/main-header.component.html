<header class="app-header">
  <div class="mx-auto grid h-[6.4rem] max-w-[90rem] grid-cols-[1fr_auto_1fr] items-center px-base">
    <div class="flex items-center justify-start">

      <button type="button" class="btn btn-outline glow-hover border-0!" aria-label="Open panel" (click)="openMainPanel()">

        <svg xmlns="http://www.w3.org/2000/svg" class="h-[2.2rem] w-[2.2rem]" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

    <a routerLink="/"
      class="text-[1.8rem] font-bold tracking-[0.08em] text-text-primary transition-colors hover:text-lup-pale">
      {{ appTitle }}
    </a>

    <nav class="hidden items-center justify-end gap-base sd:flex">
      @for (link of navLinks; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="text-text-primary"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        class="text-[1.3rem] font-semibold uppercase tracking-[0.08em] text-text-muted transition-colors hover:text-lup-pale">
        {{ link.label }}
      </a>
      }
    </nav>
  </div>
</header>
