<header class="app-header">
  <div class="grid h-[6.4rem] grid-cols-[1fr_auto_1fr] items-center px-base sd:px-lg">

    <!-- menu a sinistra -->
    <div class="flex items-center justify-start">
      <button type="button" class="btn btn-outline glow-hover border-0! !px-sm"
        [attr.aria-label]="'header.openMenu' | transloco" aria-haspopup="dialog"
        [attr.aria-expanded]="isMainPanelOpen()" (click)="openMainPanel()">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-[2.2rem] w-[2.2rem]" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

    <!-- titolo al centro -->
    <!-- titolo al centro -->
    <a routerLink="/" [attr.aria-label]="'header.homeLink' | transloco: { version: appVersion }"
      class="flex items-baseline gap-[0.6rem] justify-self-center whitespace-nowrap text-[1.6rem] font-bold tracking-[0.08em] text-text-primary transition-colors hover:text-lup-pale sd:text-[1.8rem]">
      {{ appTitle | uppercase }}
      <small class="text-[1rem] font-semibold normal-case tracking-normal text-text-muted">
        v{{ appVersion }}
      </small>
    </a>

    <!-- link + selettore lingua a destra -->
    <div class="flex items-center justify-end gap-sm sd:gap-base">
      <!-- nav renderizzata solo se ci sono link: niente landmark vuoti -->
      @if (navLinks.length) {
      <nav class="flex items-center gap-sm sd:gap-base">
      @for (link of navLinks; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="text-text-primary"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        class="whitespace-nowrap text-[1.2rem] font-semibold uppercase tracking-[0.06em] text-text-muted transition-colors hover:text-lup-pale sd:text-[1.3rem] sd:tracking-[0.08em]">
        {{ link.label }}
      </a>
      }
      </nav>
      }

      <app-language-switcher />
    </div>
  </div>
</header>
