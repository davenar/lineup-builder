@if (state(); as panel) {
<div class="panel-root" [class.panel-root-open]="panel.isOpen" [ngStyle]="rootStyles()">
  @if (panel.options.showBackdrop) {
  <!-- solo per il mouse: da tastiera si chiude con il pulsante dedicato o con Escape -->
  <button type="button" class="panel-backdrop" [class.panel-backdrop-open]="panel.isOpen" tabindex="-1"
    aria-hidden="true" (click)="closeFromBackdrop()"></button>
  }

  <!-- focus trap: porta il focus nel pannello all'apertura e lo restituisce all'elemento di origine alla chiusura -->
  <aside role="dialog" aria-modal="true" [attr.aria-label]="panel.options.ariaLabel" [class]="panelClasses()"
    [ngStyle]="panelStyles()" cdkTrapFocus [cdkTrapFocusAutoCapture]="true" [attr.inert]="panel.isOpen ? null : ''">
    @if (hasCloseMode('close-button')) {

    <button type="button" class="btn btn-outline btn-rounded glow-hover panel-close-btn !px-sm"
      [attr.aria-label]="'panel.close' | transloco" (click)="closeFromButton()">

      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-[2rem] w-[2rem]" fill="none" viewBox="0 0 24 24"
        stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    }

    <ng-container [ngComponentOutlet]="panel.component" [ngComponentOutletInputs]="panel.inputs" />
  </aside>
</div>
}
