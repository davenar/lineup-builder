<footer class="border-t border-lup-mid bg-bg-surface">
  <div class="mx-auto max-w-[90rem] px-base py-xl">
    <div class="grid grid-cols-1 gap-lg tb:grid-cols-3">
      @for (col of columns; track col.heading) {
      <div>
        <h3 class="text-[1.3rem] font-bold uppercase tracking-[0.08em] text-text-primary">
          {{ col.heading }}
        </h3>

        <ul class="mt-base flex flex-col gap-sm">
          @for (link of col.links; track link.path) {
          <li>
            <a [routerLink]="link.path"
              class="text-[1.3rem] font-semibold text-text-muted transition-colors hover:text-lup-pale">
              {{ link.label }}
            </a>
          </li>
          }
        </ul>
      </div>
      }
    </div>

    <div class="mt-xl border-t border-lup-mid pt-lg text-center">
      <p class="mb-0 text-[1.2rem] text-text-muted">
        &copy; {{ currentYear }} MyApp. All rights reserved.
      </p>
    </div>
  </div>
</footer>
