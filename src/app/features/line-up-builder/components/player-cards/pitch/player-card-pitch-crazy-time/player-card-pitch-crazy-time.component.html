@if (player()) {
<div
  class="ct-card glow-hover relative flex aspect-[71/100] h-[85cqh] sd:h-[75cqh] cursor-pointer flex-col [container-type:size]"
  (click)="onOpenSearchPanel()">

  <!-- bottone rimuovi: FUORI da .ct-inner così non viene clippato -->
  <button type="button"
    class="ct-remove glow-hover absolute -top-[15cqw] -right-[15cqw] z-40 flex h-[30cqw] w-[30cqw] cursor-pointer items-center justify-center rounded-full text-white sd:-top-[10cqw] sd:-right-[10cqw] sd:h-[20cqw] sd:w-[20cqw]"
    aria-label="Rimuovi giocatore" (click)="onRemovePlayer($event)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" class="h-[75%] w-[75%]">
      <line x1="6" y1="6" x2="18" y2="18" />
      <line x1="18" y1="6" x2="6" y2="18" />
    </svg>
  </button>

  <!-- cornice: un solo layer, conic-gradient ritagliato a bordo da mask -->
  <div class="ct-border" aria-hidden="true"></div>

  <!-- contenuto -->
  <div class="ct-inner relative z-10 flex h-full w-full flex-col overflow-hidden">

    <!-- club: gettone scuro in alto a sinistra -->
    <div class="ct-chip absolute left-[5cqw] top-[5cqw] z-20 flex h-[28cqw] w-[28cqw] items-center justify-center rounded-full sd:h-[24cqw] sd:w-[24cqw]">
      <img [src]="player()!.club_img" [alt]="player()!.teamname" [title]="player()!.teamname"
        class="h-[70%] w-[70%] object-contain" loading="lazy" />
    </div>

    <!-- foto giocatore: bandiera enorme come sfondo dietro -->
    <div class="relative flex min-h-0 flex-1 items-end justify-center overflow-hidden">
      <img [src]="player()!.nation_img" [alt]="player()!.nationname" aria-hidden="true"
        class="ct-flag-bg absolute inset-0 h-full w-full object-cover" loading="lazy" />
      <div class="ct-rays absolute inset-0" aria-hidden="true"></div>

      <img [src]="player()!.player_img" [alt]="player()!.shortname"
        class="relative z-10 h-[96%] w-auto object-contain object-bottom drop-shadow-[0_0_8px_rgba(0,0,0,0.6)]"
        loading="lazy" />

      <!-- ruolo: gettone in basso a sinistra -->
      <span class="ct-token ct-token-role absolute bottom-[3cqw] left-[3cqw] z-20 rounded-[4cqw] px-[5cqw] py-[2cqw] text-[13cqw] font-black leading-none text-white sd:text-[12cqw]"
        [title]="slot.fullLabel">
        {{ slot.label }}
      </span>

      <!-- overall: gettone in basso a destra -->
      <span class="ct-token ct-token-ovr absolute bottom-[3cqw] right-[3cqw] z-20 rounded-[4cqw] px-[5cqw] py-[2cqw] text-[14cqw] font-black leading-none text-black sd:text-[13cqw]">
        {{ player()!.overallrating }}
      </span>
    </div>

    <!-- TABELLONE nome -->
    <div class="ct-board w-full overflow-hidden px-[6cqw] py-[3cqw]">
      <div #nameViewport class="w-full overflow-hidden">
        <div class="flex w-max" [class.animate-marquee]="isNameOverflowing()"
          [class.mx-auto]="!isNameOverflowing()">
          <span #nameText
            class="ct-board-text whitespace-nowrap px-[4cqw] text-[16cqw] font-black uppercase leading-tight tracking-wider sd:text-[14cqw]">
            {{ player()!.shortname }}
          </span>
          @if (isNameOverflowing()) {
          <span
            class="ct-board-text whitespace-nowrap px-[4cqw] text-[16cqw] font-black uppercase leading-tight tracking-wider sd:text-[14cqw]"
            aria-hidden="true">
            {{ player()!.shortname }}
          </span>
          }
        </div>
      </div>
    </div>
  </div>
</div>
} @else {
<button type="button"
  class="ct-empty glow-hover flex aspect-square h-[52cqmin] items-center justify-center rounded-full text-white cursor-pointer"
  [attr.aria-label]="'Aggiungi giocatore - ' + slot.fullLabel" (click)="onOpenSearchPanel()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
    stroke-linecap="round" class="h-[45%] w-[45%]">
    <line x1="12" y1="5" x2="12" y2="19" />
    <line x1="5" y1="12" x2="19" y2="12" />
  </svg>
</button>
}
