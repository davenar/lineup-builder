@if (player()) {
<div class="glow-hover relative flex aspect-[71/100] w-full flex-col bg-white shadow-[0_2px_8px_rgba(0,0,0,0.45)] [container-type:size]">

    <!-- bottone rimuovi -->
    <button type="button"
        class="glow-hover absolute -top-[15cqw] -right-[15cqw] z-30 flex h-[30cqw] w-[30cqw] cursor-pointer items-center justify-center rounded-full border border-white/30 bg-red-600 text-white sd:-top-[10cqw] sd:-right-[10cqw] sd:h-[20cqw] sd:w-[20cqw]"
        [attr.aria-label]="'lineup.removePlayer' | transloco: { player: player()!.shortname }" (click)="onRemovePlayer($event)">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
            class="h-[75%] w-[75%]">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
        </svg>
    </button>

    <!-- bottone sostituisci: quadrato, sotto la x -->
    <button type="button"
        class="glow-hover absolute -right-[15cqw] top-[20cqw] z-30 flex h-[30cqw] w-[30cqw] cursor-pointer items-center justify-center rounded-[4cqw] border border-white/30 bg-lup-accent text-white sd:-right-[10cqw] sd:top-[14cqw] sd:h-[20cqw] sd:w-[20cqw]"
        [attr.aria-label]="'lineup.replacePlayer' | transloco: { player: player()!.shortname }" (click)="onOpenSearchPanel()">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" class="h-[65%] w-[65%]">
            <path d="M4 7h13M13 3l4 4-4 4" />
            <path d="M20 17H7M11 21l-4-4 4-4" />
        </svg>
    </button>

    <!-- club: OVERLAY assoluto in alto a sinistra -->
    <div class="absolute left-[5cqw] top-[5cqw] z-20">
        <img [src]="player()!.club_img || 'images/placeholders/club.svg'" appImgFallback="images/placeholders/club.svg" [alt]="player()!.teamname" [title]="player()!.teamname"
            class="h-[26cqw] w-[26cqw] object-contain sd:h-[22cqw] sd:w-[22cqw]" loading="lazy" />
    </div>

    <!-- foto giocatore: ancorata in basso, appiccicata sopra il footer del nome -->
    <div
        class="relative flex min-h-0 flex-1 items-end justify-center overflow-hidden bg-gradient-to-b from-lup-pale to-lup-lightest">
        <img [src]="player()!.player_img || 'images/placeholders/player.svg'" appImgFallback="images/placeholders/player.svg" [alt]="player()!.shortname"
            class="h-[96%] w-auto object-contain object-bottom" loading="lazy" />

        <!-- bandierina nazionalità: in basso a sinistra -->
        <img [src]="player()!.nation_img || 'images/placeholders/nation.svg'" appImgFallback="images/placeholders/nation.svg" [alt]="player()!.nationname" [title]="player()!.nationname"
            class="absolute bottom-[3cqw] left-[3cqw] z-10 h-[26cqw] w-[26cqw] object-contain sd:h-[22cqw] sd:w-[22cqw]"
            loading="lazy" />

        <!-- overall + ruolo: in basso a destra -->
        <div class="absolute bottom-[3cqw] right-[3cqw] z-10 flex flex-col items-end gap-[2cqw]">
            <span
                class="rounded-[4cqw] bg-lup-darkest px-[5cqw] py-[2cqw] text-[13cqw] font-bold leading-none text-white sd:text-[12cqw]">
                <span class="sr-only">{{ 'common.overall' | transloco }} </span>{{ player()!.overallrating }}
            </span>
            <span
                class="rounded-[4cqw] bg-lup-accent px-[5cqw] py-[2cqw] text-[13cqw] font-bold leading-none text-white sd:text-[12cqw]"
                [title]="slot.label | positionLabel: 'long' : slot.fullLabel">
                <span aria-hidden="true">{{ slot.label | positionLabel }}</span>
                <span class="sr-only">{{ slot.label | positionLabel: 'long' : slot.fullLabel }}</span>
            </span>
        </div>
    </div>

    <!-- nome con marquee -->
    <div class="w-full overflow-hidden rounded-b-[2cqw] border-t border-lup-darkest/10 bg-white px-[6cqw] py-[3cqw]">
        <div #nameViewport class="w-full overflow-hidden">
            <div class="flex w-max" [class.animate-marquee]="isNameOverflowing()"
                [class.mx-auto]="!isNameOverflowing()">
                <span #nameText
                    class="whitespace-nowrap px-[4cqw] text-[16cqw] font-bold uppercase leading-tight text-lup-darkest sd:text-[14cqw]">
                    {{ player()!.shortname }}
                </span>
                @if (isNameOverflowing()) {
                <span
                    class="whitespace-nowrap px-[4cqw] text-[16cqw] font-bold uppercase leading-tight text-lup-darkest sd:text-[14cqw]"
                    aria-hidden="true">
                    {{ player()!.shortname }}
                </span>
                }
            </div>
        </div>
    </div>
</div>
} @else {
<!-- stato vuoto: plus SVG centrato -->
<button type="button" #addButton
    class="glow-hover mx-auto flex aspect-square w-[62%] items-center justify-center rounded-full border-2 border-dashed border-lup-pale/60 bg-lup-dark/55 text-lup-pale backdrop-blur-sm cursor-pointer"
    [attr.aria-label]="'lineup.addPlayer' | transloco: { position: (slot.label | positionLabel: 'long' : slot.fullLabel) }" (click)="onOpenSearchPanel()">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        class="h-[45%] w-[45%]">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
    </svg>
</button>
}
