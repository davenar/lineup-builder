@if (player()) {
<div
  class="ct-row glow-hover relative flex w-full items-stretch overflow-hidden">

  <!-- cornice di luci rotante, identica alla card del pitch -->
  <div class="ct-spin-border" aria-hidden="true"></div>

  <!-- contenuto sopra la cornice, con margine che lascia vedere il bordo -->
  <div class="ct-inner relative z-10 flex w-full items-stretch overflow-hidden">

    <!-- foto figurina con bandiera di sfondo -->
    <div class="relative flex h-[6rem] w-[5.4rem] flex-shrink-0 items-end justify-center overflow-hidden">
      <img [src]="player()!.nation_img || 'images/placeholders/nation.svg'" appImgFallback="images/placeholders/nation.svg" alt="" aria-hidden="true"
        class="ct-flag-bg absolute inset-0 h-full w-full object-cover" loading="lazy" />
      <img [src]="player()!.player_img || 'images/placeholders/player.svg'" appImgFallback="images/placeholders/player.svg" [alt]="player()!.shortname"
        class="relative z-10 h-[95%] w-auto max-w-none object-contain object-bottom drop-shadow-[0_0_4px_rgba(0,0,0,0.7)]"
        loading="lazy" />
    </div>

    <!-- bandiera country + overall -->
    <div class="relative z-10 flex flex-shrink-0 flex-col items-center justify-center gap-[0.4rem] px-base">
      <img [src]="player()!.nation_img || 'images/placeholders/nation.svg'" appImgFallback="images/placeholders/nation.svg" [alt]="player()!.nationname" [title]="player()!.nationname"
        class="h-[2.4rem] w-[2.4rem] object-contain" loading="lazy" />
      <span class="ct-ovr rounded-[0.4rem] px-[0.6rem] py-[0.2rem] text-[1.2rem] font-black leading-none text-black">
        <span class="sr-only">{{ 'common.overall' | transloco }} </span>{{ player()!.overallrating }}
      </span>
    </div>

    <!-- nome (LED rosso) + squadra -->
    <div class="relative z-10 flex min-w-0 flex-1 flex-col justify-center pr-base">
      <span class="ct-name truncate text-[1.5rem] font-black uppercase leading-tight tracking-wide">
        {{ player()!.shortname }}
      </span>
      <span class="truncate text-[1.2rem] leading-tight text-cyan-300/70">
        {{ player()!.teamname }}
      </span>
    </div>

    <!-- colonna azioni: x rimuovi + sostituisci -->
    <div class="relative z-10 mr-base flex flex-shrink-0 flex-col items-center justify-center gap-[0.6rem] self-center">
      <button type="button"
        class="ct-remove glow-hover flex h-[2.4rem] w-[2.4rem] cursor-pointer items-center justify-center rounded-full text-white"
        [attr.aria-label]="'lineup.removePlayer' | transloco: { player: player()!.shortname }" (click)="onRemovePlayer($event)">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round" class="h-[55%] w-[55%]">
          <line x1="6" y1="6" x2="18" y2="18" />
          <line x1="18" y1="6" x2="6" y2="18" />
        </svg>
      </button>
      <button type="button"
        class="glow-hover flex h-[2.4rem] w-[2.4rem] cursor-pointer items-center justify-center rounded-[0.5rem] border border-white/60 bg-gradient-to-br from-[#00e6ff] to-[#b400ff] text-white"
        [attr.aria-label]="'lineup.replacePlayer' | transloco: { player: player()!.shortname }" (click)="onOpenSearchPanel()">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round" class="h-[65%] w-[65%]">
          <path d="M4 7h13M13 3l4 4-4 4" />
          <path d="M20 17H7M11 21l-4-4 4-4" />
        </svg>
      </button>
    </div>
  </div>
</div>
} @else {
<!-- stato vuoto: riga slot pulsante -->
<button type="button" #addButton
  class="ct-empty glow-hover flex w-full cursor-pointer items-center gap-base px-base py-[1.2rem] text-left"
  (click)="onOpenSearchPanel()">
  <span class="ct-empty-chip flex h-[3.6rem] w-[3.6rem] flex-shrink-0 items-center justify-center rounded-full text-white">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" class="h-[45%] w-[45%]">
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </svg>
  </span>
  <span class="text-[1.4rem] font-black uppercase tracking-wide text-cyan-200">
    {{ 'lineup.addSubstitute' | transloco: { index: benchIndex } }}
  </span>
</button>
}
