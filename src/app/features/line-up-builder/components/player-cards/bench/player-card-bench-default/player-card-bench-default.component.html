@if (player()) {
  <div
    class="flex w-full items-center gap-base border border-lup-soft/30 px-base py-xs cursor-pointer"
    (click)="onOpenSearchPanel()"
  >
    <span class="text-[1.4rem] text-text-primary flex-1">{{ player()!.shortname }}</span>
    <span class="text-[1.2rem] text-text-muted">{{ player()!.mainposition }}</span>
    <span class="text-[1.4rem] font-semibold text-text-primary">{{ player()!.overallrating }}</span>
    <button
      type="button"
      class="text-[1.4rem] text-text-muted hover:text-text-primary"
      aria-label="Rimuovi giocatore"
      (click)="onRemovePlayer($event)"
    >
      ×
    </button>
  </div>
} @else {
  <button
    type="button"
    class="flex w-full items-center gap-base border border-lup-soft/30 px-base py-xs text-left cursor-pointer"
    (click)="onOpenSearchPanel()"
  >
    <span class="text-[1.4rem] text-text-muted">+ Aggiungi riserva {{ benchIndex }}</span>
  </button>
}
