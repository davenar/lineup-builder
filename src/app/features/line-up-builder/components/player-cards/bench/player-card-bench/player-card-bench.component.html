@switch (lineupState.benchCardStyle()) {
  @case ('default') {
    <app-player-card-bench-default [benchIndex]="benchIndex" />
  }
  @case ('sticker') {
    <app-player-card-bench-sticker [benchIndex]="benchIndex" />
  }
   @case ('crazy-time') {
    <app-player-card-bench-crazy-time [benchIndex]="benchIndex" />
  }
  @default {
    <app-player-card-bench-sticker [benchIndex]="benchIndex" />
  }
}
