<div class="flex flex-col sd:flex-row w-full sd:h-screen" cdkDropListGroup>

  <!-- PITCH -->
  <div class="w-full sd:w-1/2 flex items-start justify-center p-base">
    <div
      [class]="'relative [container-type:size] [aspect-ratio:68/105] [max-height:75dvh] sd:[max-height:85dvh] [width:min(calc(75dvh*68/105),100%)] sd:[width:min(calc(85dvh*68/105),100%)] ' + pitchClasses()">
      <!-- Linee del campo: regolamentari IFAB in scala 1 unità = 1 dm -->
      <svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 680 1050" fill="none"
        aria-hidden="true">
        <g stroke="var(--pitch-line, rgba(255,255,255,0.45))" stroke-width="2">
          <rect x="1" y="1" width="678" height="1048" />
          <line x1="1" y1="525" x2="679" y2="525" />
          <circle cx="340" cy="525" r="91.5" />
          <circle cx="340" cy="525" r="3" fill="var(--pitch-line, rgba(255,255,255,0.45))" stroke="none" />
          <rect x="138.4" y="1" width="403.2" height="164" />
          <rect x="248.4" y="1" width="183.2" height="54" />
          <circle cx="340" cy="110" r="3" fill="var(--pitch-line, rgba(255,255,255,0.45))" stroke="none" />
          <path d="M 266.9 165 A 91.5 91.5 0 0 0 413.1 165" />
          <rect x="138.4" y="885" width="403.2" height="164" />
          <rect x="248.4" y="995" width="183.2" height="54" />
          <circle cx="340" cy="940" r="3" fill="var(--pitch-line, rgba(255,255,255,0.45))" stroke="none" />
          <path d="M 266.9 885 A 91.5 91.5 0 0 1 413.1 885" />
          <path d="M 0 10 A 10 10 0 0 0 10 0" />
          <path d="M 670 0 A 10 10 0 0 0 680 10" />
          <path d="M 10 1050 A 10 10 0 0 0 0 1040" />
          <path d="M 680 1040 A 10 10 0 0 0 670 1050" />
        </g>
      </svg>

      @for (slot of activeSlots(); track slot.cellIndex) {
      <div class="absolute -translate-x-1/2 -translate-y-1/2 w-[16cqw] sd:w-[14cqw]"
        [style.left.%]="slot.x" [style.top.%]="slot.y"
        cdkDropList
        [cdkDropListData]="pitchOrigin(slot.cellIndex)"
        [cdkDropListSortingDisabled]="true"
        (cdkDropListDropped)="onDrop($event)">
        <div cdkDrag
          [cdkDragDisabled]="!hasPitchPlayer(slot.cellIndex)"
          [cdkDragStartDelay]="dragStartDelay"
          (contextmenu)="$event.preventDefault()">

          <!-- preview compatta a dimensione fissa: mai più card giganti -->
          <div *cdkDragPreview
            class="flex w-[9rem] flex-col items-center overflow-hidden rounded-[0.8rem] border border-lup-soft/40 bg-bg-elevated shadow-[0_8px_24px_rgba(0,0,0,0.6)]">
            <div class="relative flex h-[9rem] w-full items-end justify-center overflow-hidden bg-gradient-to-b from-lup-pale to-lup-lightest">
              <img [src]="pitchPlayer(slot.cellIndex)?.player_img || 'images/placeholders/player.svg'" appImgFallback="images/placeholders/player.svg" alt=""
                class="h-[105%] w-auto object-contain object-bottom" />
              <span class="absolute right-[0.4rem] top-[0.4rem] rounded-[0.4rem] bg-lup-darkest px-[0.5rem] py-[0.2rem] text-[1.2rem] font-bold leading-none text-white">
                {{ pitchPlayer(slot.cellIndex)?.overallrating }}
              </span>
            </div>
            <span class="w-full truncate bg-lup-darkest px-[0.6rem] py-[0.4rem] text-center text-[1.1rem] font-bold uppercase leading-none text-white">
              {{ pitchPlayer(slot.cellIndex)?.shortname }}
            </span>
          </div>

          <app-player-card-pitch [slot]="slot" />
        </div>
      </div>
      }
    </div>
  </div>

  <!-- BENCH -->
  <div class="w-full sd:w-1/2 flex flex-col justify-start p-base gap-sm">
    @for (benchIndex of benchSlots; track benchIndex) {
    <div cdkDropList
      class="min-h-[6rem] rounded-[0.8rem] has-[.cdk-drag-placeholder]:border-2 has-[.cdk-drag-placeholder]:border-dashed has-[.cdk-drag-placeholder]:border-lup-soft/25"
      [cdkDropListData]="benchOrigin(benchIndex)"
      [cdkDropListSortingDisabled]="true"
      (cdkDropListDropped)="onDrop($event)">
      <div cdkDrag
        [cdkDragDisabled]="!hasBenchPlayer(benchIndex)"
        [cdkDragStartDelay]="dragStartDelay"
        (contextmenu)="$event.preventDefault()">

        <!-- stessa preview compatta del pitch: coerenza nei due versi -->
        <div *cdkDragPreview
          class="flex w-[9rem] flex-col items-center overflow-hidden rounded-[0.8rem] border border-lup-soft/40 bg-bg-elevated shadow-[0_8px_24px_rgba(0,0,0,0.6)]">
          <div class="relative flex h-[9rem] w-full items-end justify-center overflow-hidden bg-gradient-to-b from-lup-pale to-lup-lightest">
            <img [src]="benchPlayer(benchIndex)?.player_img || 'images/placeholders/player.svg'" appImgFallback="images/placeholders/player.svg" alt=""
              class="h-[105%] w-auto object-contain object-bottom" />
            <span class="absolute right-[0.4rem] top-[0.4rem] rounded-[0.4rem] bg-lup-darkest px-[0.5rem] py-[0.2rem] text-[1.2rem] font-bold leading-none text-white">
              {{ benchPlayer(benchIndex)?.overallrating }}
            </span>
          </div>
          <span class="w-full truncate bg-lup-darkest px-[0.6rem] py-[0.4rem] text-center text-[1.1rem] font-bold uppercase leading-none text-white">
            {{ benchPlayer(benchIndex)?.shortname }}
          </span>
        </div>

        <app-player-card-bench [benchIndex]="benchIndex" />
      </div>
    </div>
    }
  </div>

</div>
